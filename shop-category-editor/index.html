<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./style.css" rel="stylesheet" />
  <script src="./script.js" defer></script>
  <title>Shop Category Editor</title>
</head>

<body>
  <main class="wrapper">
    <section class="editor-section" aria-labelledby="section-title">
      <h1 id="section-title">Edytor kategorii</h1>

      <div class="editor-panel">
        <div class="edit-panel-forms">
          <div class="editor-form__wrapper">
            <h2>Dodaj kategorię</h2>

            <form action="#" method="post" id="add-category-form" class="category-form">
              <div class="form-row">
                <label for="category-name">Nazwa kategorii</label>
                <input type="text" name="category_name" id="category-name" required />
              </div>

              <div class="form-row">
                <label for="category-parent-select">Kategoria nadrzędna</label>
                <select id="category-parent-select" name="category_parent">
                  <option value="0" selected>Kategoria główna</option>
                </select>
              </div>

              <button type="submit">Dodaj kategorię</button>
            </form>
          </div>

          <div class="editor-form__wrapper">
            <h2>Przenieś kategorię</h2>

            <form action="#" method="post" id="swap-category-form" class="category-form">
              <div class="form-row">
                <label for="category-to-swap-select">Kategoria do przeniesienia</label>
                <select id="category-to-swap-select" name="swap_category">
                  <option value="0" selected>Kategoria główna</option>
                </select>
              </div>

              <div class="form-row">
                <label for="new-category-swap-select">Nowa kategoria nadrzędna</label>
                <select id="new-category-swap-select" name="new_category_swap">
                  <option value="0" selected>Kategoria główna</option>
                </select>
              </div>

              <button type="submit">Przenieś kategorię</button>
            </form>
          </div>
        </div>

        <div class="category-content">
          <div class="category-content__header">
            <h2>Kategorie</h2>
            <button type="button" id="undo-button" class="undo-button" data-action="undo">Cofnij zmianę</button>
            <p id="category-count" aria-live="polite">6 kategorii</p>
          </div>

          <ul id="parent-list" class="parent-list">
            <li class="parent-item">
              <div class="parent-item__wrapper">
                <p class="parent-name">Elekronika</p>
                <button type="button" class="delete-button" data-action="delete"
                  aria-label="Usuń kategorię Elektronika">Usuń</button>
              </div>

              <ul data-level="1" class="children-list">
                <li class="children-item">
                  <div class="children-item__wrapper">
                    <p class="children-name">Telefony</p>
                    <button type="button" class="delete-button" data-action="delete"
                      aria-label="Usuń kategorię Telefony">Usuń</button>
                  </div>

                  <ul data-level="2" class="children-list">
                    <li class="children-item">
                      <div class="children-item__wrapper">
                        <p class="children-name">Smartfony</p>
                        <button type="button" class="delete-button" data-action="delete"
                          aria-label="Usuń kategorię Smartfony">Usuń</button>
                      </div>
                    </li>
                  </ul>
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
