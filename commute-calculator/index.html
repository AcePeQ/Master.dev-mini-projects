<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./style.css" rel="stylesheet" />
  <script src="./script.js" defer></script>
  <title>Kalkulator dojazdów</title>
</head>

<body>
  <main class="main">
    <div class="wrapper">
      <hgroup>
        <h1>Kalkulator dojazdów</h1>
        <p>Kalkulator ten służy do obliczania ceny dojazdu w jedną stronę, dzięki określeniu średniemu spalaniu, ceny
          paliwa oraz liczbie dni doajzdu w miesiącu</p>
      </hgroup>


      <form action="" method="get" id="commute-form" class="commute-form">
        <div class="input-row">
          <label for="distance" class="label">Dystans w jedną stronę (km)</label>
          <input type="number" id="distance" name="distance" required aria-invalid="false"
            aria-describedby="distance-error" />
          <p id="distance-error" class="input-error hidden"></p>
        </div>

        <div class="input-row">
          <label for="average" class="label">Średnie spalanie (l/100km)</label>
          <input type="number" id="average" name="average" required aria-invalid="false"
            aria-describedby="average-error" />
          <p id="average-error" class="input-error hidden"></p>
        </div>

        <div class="input-row">
          <label for="price" class="label">Cena paliwa (zł/l)</label>
          <input type="number" id="price" name="price" required aria-invalid="false" aria-describedby="price-error" />
          <p id="price-error" class="input-error hidden"></p>
        </div>

        <div class=" input-row">
          <label for="days" class="label">Liczba dni dojazdu w miesiącu</label>
          <input type="number" id="days" name="days" required aria-invalid="false" aria-describedby="days-error" />
          <p id="days-error" class="input-error hidden"></p>
        </div>

        <button class="button" id="btn-submit" type="submit">Oblicz</button>
      </form>


      <section class="summary" aria-labelledby="summary-title" aria-live="polite" hidden>
        <h2 id="summary-title">Podsumowanie</h2>
        <p>Szacowany miesięczny koszt dojazdów</p>
        <output id="monthly-cost" for="distance average price days">0,00 zł</output>
      </section>
    </div>
  </main>
</body>

</html>
